name: DoYouHaveMatch
options:
  bundleIdPrefix: jp.inagawa
targets:
  DoYouHaveMatch:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [DoYouHaveMatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.inagawa.DoYouHaveMatch
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
